name: EvalSense
on: [push, pull_request]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          version: 0.7.3
          activate-environment: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Install project
        run: uv sync --all-extras --dev
      - run: echo "$PWD/.venv/bin" >> $GITHUB_PATH
      - name: Check pinned metric scripts and provenance
        env:
          EVALSENSE_TEST_NATIVE_METRICS: "1"
          EVALSENSE_TEST_BERTSCRIPT: "1"
          MPLBACKEND: Agg
        run: uv run --no-sync python -m unittest discover -s tests -p 'test_metric_implementation.py' -v
      - name: Typecheck project
        uses: jakebailey/pyright-action@v2
        with:
          version: 1.1.399

  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evalsense
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.11.4
